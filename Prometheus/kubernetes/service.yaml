# 集群内访问
apiVersion: v1
kind: Service
metadata:
  name: prometheus-headless
spec:
  clusterIP: None
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    name: http
---
# 集群外访问
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    # nodePort: 30090
    name: http