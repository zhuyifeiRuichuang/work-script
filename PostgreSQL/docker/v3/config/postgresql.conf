# ==============================================================================
# PostgreSQL 18 生产环境推荐配置 (适配 ~8GB RAM, 4 CPU, SSD 环境)
# ==============================================================================

# -----------------------------
# 连接与认证 (Connection & Auth)
# -----------------------------
listen_addresses = '*'
max_connections = 300                 # 最大连接数，配合 PgBouncer 等连接池使用更佳
superuser_reserved_connections = 5    # 为超级用户保留的连接数

# -----------------------------
# 内存配置 (Memory)
# -----------------------------
shared_buffers = 2GB                  # 通常设为总内存的 25% (假设宿主机分给该容器 8G)
effective_cache_size = 6GB            # 通常设为总内存的 75%
maintenance_work_mem = 512MB          # 加速 VACUUM, CREATE INDEX 等维护操作
work_mem = 6990kB                     # 每个连接排序/哈希等操作的内存，计算公式: (总RAM - shared_buffers) / max_connections
logical_decoding_work_mem = 64MB      # 逻辑复制解码内存

# -----------------------------
# 磁盘与 IO (Disk & IO)
# -----------------------------
# 假设底层是 SSD，将随机访问成本调低
random_page_cost = 1.1
effective_io_concurrency = 200        # SSD 推荐 200 左右

# -----------------------------
# 检查点与 WAL (Checkpoints & WAL)
# -----------------------------
wal_level = replica                   # 支持流复制
max_wal_size = 4GB                    # 增加 WAL 大小可减少 Checkpoint 频率，提升写性能
min_wal_size = 1GB
checkpoint_completion_target = 0.9    # 将检查点写入平摊到整个间隔期间，减少 I/O 尖峰
checkpoint_timeout = 15min            # 检查点超时时间
wal_buffers = 16MB                    # WAL 缓冲区大小
wal_writer_delay = 200ms

# -----------------------------
# 统计与自动清理 (Statistics & Autovacuum)
# -----------------------------
default_statistics_target = 100
autovacuum = on
autovacuum_max_workers = 4            # CPU 核数多可以适当增加
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms

# -----------------------------
# 日志记录 (Logging)
# -----------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000     # 记录执行超过 1000ms 的慢 SQL
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'ddl'                 # 仅记录 DDL 语句 (CREATE/DROP 等)
log_timezone = 'Asia/Shanghai'
