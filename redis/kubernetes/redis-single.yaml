---
# 1. 存储 Redis 密码
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
type: Opaque
data:
  # 生成加密后的密码：echo -n "root123456" | base64
  redis-password: cm9vdDEyMzQ1Ng==

---
# 2. Redis 基础配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    appendonly yes
    protected-mode yes
    bind 0.0.0.0
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    tcp-keepalive 300
    # 注意：此处不直接写密码，通过启动参数注入

---
# 3. 持久化存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# 4. Redis 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # 优化内核参数
      initContainers:
      - name: init-sysctl
        image: busybox
        command: ["sh", "-c", "sysctl -w net.core.somaxconn=1024 && sysctl -w vm.overcommit_memory=1"]
        securityContext:
          privileged: true
      
      containers:
      - name: redis
        image: redis:8.6.2
        # 使用环境变量注入密码并启动
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        command: 
        - "sh"
        - "-c"
        - "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$REDIS_PASSWORD\" --masterauth \"$REDIS_PASSWORD\""
        
        ports:
        - containerPort: 6379
          name: redis-port
        
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"

        # 健康检查
        startupProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        
        livenessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
          initialDelaySeconds: 15
          periodSeconds: 20
        
        readinessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
          initialDelaySeconds: 5
          periodSeconds: 10

        volumeMounts:
        - name: redis-config-volume
          mountPath: /usr/local/etc/redis/
        - name: redis-data
          mountPath: /data

        securityContext:
          runAsUser: 999
          allowPrivilegeEscalation: false

      volumes:
      - name: redis-config-volume
        configMap:
          name: redis-config
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data-pvc

---
# 5. 内部服务 (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: redis-internal
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: redis-port

---
# 6. 外部服务 (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: redis-external
spec:
  type: NodePort
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: redis-port