---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alist-pvc
  labels:
    app: alist
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alist-deployment
  labels:
    app: alist
spec:
  replicas: 1

  selector:
    matchLabels:
      app: alist

  template:
    metadata:
      labels:
        app: alist

    spec:
      initContainers:
        - name: init-config
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox:1.38.0
          command: ['sh', '-c', 'if [ ! -f /data/config.json ]; then cp /config-src/config.json /data/config.json; echo "config.json copied"; else echo "config.json already exists, skipping"; fi']
          volumeMounts:
            - name: alist-config
              mountPath: /config-src
            - name: alist-data
              mountPath: /data

      containers:
        - name: alist-container
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/ghcr.io/alistgo/alist:v3.62.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5244
              protocol: TCP

          env:
            - name: PUID
              value: "0"

            - name: PGID
              value: "0"

            - name: UMASK
              value: "022"

          volumeMounts:
            - name: alist-data
              mountPath: /opt/alist/data

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: alist-config
          configMap:
            name: alist-config
        - name: alist-data
          persistentVolumeClaim:
            claimName: alist-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: alist-clusterip-service
  labels:
    app: alist

spec:
  type: ClusterIP

  selector:
    app: alist

  ports:
    - name: http
      protocol: TCP
      port: 5244
      targetPort: 5244
---
apiVersion: v1
kind: Service
metadata:
  name: alist-nodeport-service
  labels:
    app: alist

spec:
  type: NodePort

  selector:
    app: alist

  ports:
    - name: http
      protocol: TCP
      port: 5244
      targetPort: 5244
