server {
    listen       80;
    listen  [::]:80;
    server_name _; # 生产环境请替换为你的域名或主机IP及EIP，如 www.example.com

    # 字符集编码，避免中文乱码
    charset utf-8;

    # 日志配置（注意：路径需与 Docker 挂载路径对应）
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # 1. 静态资源根目录
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # 支持单页应用(SPA)路由
    }

    # 2. 动静分离/反向代理示例（如后端运行在 8080 端口）
    # location /api/ {
    #     proxy_pass http://172.17.0.1:8080/; # 172.17.0.1 通常是 Docker 宿主机 IP
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 3. 静态资源缓存优化
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. 错误页面配置
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # 禁止访问敏感文件（如 .git 或 .env）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}