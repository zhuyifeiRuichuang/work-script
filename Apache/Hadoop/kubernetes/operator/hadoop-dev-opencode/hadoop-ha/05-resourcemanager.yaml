apiVersion: v1
kind: Service
metadata:
  name: resourcemanager
  labels:
    app: hadoop-resourcemanager
    component: resourcemanager
spec:
  ports:
    - port: 8088
      name: web
    - port: 8032
      name: rpc
    - port: 8030
      name: scheduler
    - port: 8031
      name: resource-tracker
    - port: 8033
      name: admin
  clusterIP: None
  selector:
    app: hadoop-resourcemanager
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resourcemanager
  labels:
    app: hadoop-resourcemanager
spec:
  serviceName: resourcemanager
  replicas: 2
  selector:
    matchLabels:
      app: hadoop-resourcemanager
  podManagementPolicy: Parallel
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hadoop-resourcemanager
        component: resourcemanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8088"
    spec:
      serviceAccountName: hadoop
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: hadoop-resourcemanager
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: init-rm
        image: zhuyifeiruichuang/hadoop:3.1.1
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          privileged: true
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            mkdir -p /opt/hadoop/logs /opt/hadoop/data/rm
            if id "hadoop" >/dev/null 2>&1; then
              chown -R hadoop:hadoop /opt/hadoop
            else
              chown -R 1000:1000 /opt/hadoop
            fi
            echo "ResourceManager initialization complete"
      containers:
      - name: resourcemanager
        image: zhuyifeiruichuang/hadoop:3.1.1
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "Waiting for Zookeeper..."
            for i in $(seq 1 30); do
              if nc -z zookeeper-0.zookeeper.hadoop 2181 2>/dev/null; then
                echo "Zookeeper is ready"
                break
              fi
              echo "Waiting for Zookeeper... ($i/30)"
              sleep 2
            done
            echo "Starting ResourceManager in HA mode..."
            exec yarn resourcemanager
        env:
          - name: HADOOP_CONF_DIR
            value: "/opt/hadoop/etc/hadoop"
          - name: HADOOP_LOG_DIR
            value: "/opt/hadoop/logs"
          - name: YARN_RESOURCEMANAGER_HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        ports:
          - containerPort: 8088
            name: web
            protocol: TCP
          - containerPort: 8032
            name: rpc
            protocol: TCP
          - containerPort: 8030
            name: scheduler
            protocol: TCP
          - containerPort: 8031
            name: resource-tracker
            protocol: TCP
          - containerPort: 8033
            name: admin
            protocol: TCP
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
            ephemeral-storage: "2Gi"
          limits:
            memory: "8Gi"
            cpu: "2000m"
            ephemeral-storage: "4Gi"
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - |
              nc -z localhost 8088 || exit 1
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ws/v1/cluster/info
            port: 8088
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ws/v1/cluster/info
            port: 8088
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 4
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - |
                yarn rm -refreshQueues || true
                sleep 10
        volumeMounts:
          - name: hadoop-rm-data
            mountPath: /opt/hadoop/data/rm
          - name: hadoop-logs
            mountPath: /opt/hadoop/logs
          - name: hadoop-config-volume
            mountPath: /opt/hadoop/etc/hadoop/core-site.xml
            subPath: core-site.xml
          - name: hadoop-config-volume
            mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
            subPath: hdfs-site.xml
          - name: hadoop-config-volume
            mountPath: /opt/hadoop/etc/hadoop/yarn-site.xml
            subPath: yarn-site.xml
          - name: hadoop-config-volume
            mountPath: /opt/hadoop/etc/hadoop/mapred-site.xml
            subPath: mapred-site.xml
          - name: hadoop-config-volume
            mountPath: /opt/hadoop/etc/hadoop/capacity-scheduler.xml
            subPath: capacity-scheduler.xml
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoSchedule"
        tolerationSeconds: 60
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoSchedule"
        tolerationSeconds: 60
      nodeSelector:
        hadoop-role: master
      volumes:
        - name: hadoop-config-volume
          configMap:
            name: hadoop-config
        - name: hadoop-logs
          emptyDir: {}
        - name: hadoop-rm-data
          emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: hadoop-rm-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "local"
      resources:
        requests:
          storage: 10Gi