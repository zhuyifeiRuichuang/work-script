# 生产环境高可用 Hadoop 集群配置示例
# Production-ready HA Hadoop Cluster Configuration
#
# 特性说明：
# - NameNode HA: 2个NameNode实例 + 3个JournalNode，自动故障转移
# - ResourceManager HA: 2个ResourceManager实例
# - ZooKeeper: 自动部署3节点集群（或配置外部ZooKeeper）
# - DataNode: 3个实例，数据3副本
# - NodeManager: 3个实例
# - Pod反亲和性：确保组件分布在不同节点
# - PodDisruptionBudget: 保证滚动更新时的可用性
# - 配置变更自动滚动重启（通过 ConfigMap hash 注解）
# - 优雅终止（PreStop hook + TerminationGracePeriod）
# - 持久化存储 + 合理的资源配置
# - Prometheus 监控集成

apiVersion: hadoop.apache.org/v1
kind: HadoopCluster
metadata:
  name: hadoop-production
  namespace: hadoop
  labels:
    app.kubernetes.io/name: hadoopcluster
    app.kubernetes.io/instance: hadoop-production
    app.kubernetes.io/part-of: hadoop-operator
    environment: production
spec:
  image:
    repository: apache/hadoop
    tag: "3.3.6"
    pullPolicy: IfNotPresent

  hdfs:
    nameNode:
      replicas: 2
      ha:
        enabled: true
        # 如需使用外部 ZooKeeper，取消下面的注释
        # zookeeper:
        #   connectionString: "zk1.example.com:2181,zk2.example.com:2181,zk3.example.com:2181"
        journalNode:
          replicas: 3
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "1000m"
          storage:
            size: "100Gi"
            storageClassName: standard
            accessMode: ReadWriteOnce
      resources:
        requests:
          memory: "8Gi"
          cpu: "2000m"
        limits:
          memory: "16Gi"
          cpu: "4000m"
      storage:
        size: "200Gi"
        storageClassName: standard
        accessMode: ReadWriteOnce
      service:
        type: ClusterIP
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - hadoop-namenode
            topologyKey: kubernetes.io/hostname
      tolerations: []

    dataNode:
      replicas: 3
      resources:
        requests:
          memory: "4Gi"
          cpu: "1000m"
        limits:
          memory: "8Gi"
          cpu: "2000m"
      storage:
        size: "1Ti"
        storageClassName: standard
        accessMode: ReadWriteOnce
      service:
        type: ClusterIP
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - hadoop-datanode
            topologyKey: kubernetes.io/hostname

  yarn:
    resourceManager:
      replicas: 2
      ha:
        enabled: true
      resources:
        requests:
          memory: "4Gi"
          cpu: "1000m"
        limits:
          memory: "8Gi"
          cpu: "2000m"
      service:
        type: ClusterIP
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - hadoop-resourcemanager
            topologyKey: kubernetes.io/hostname

    nodeManager:
      replicas: 3
      resources:
        requests:
          memory: "4Gi"
          cpu: "1000m"
        limits:
          memory: "8Gi"
          cpu: "2000m"
      service:
        type: ClusterIP
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - hadoop-nodemanager
            topologyKey: kubernetes.io/hostname

  config:
    coreSite:
      "hadoop.tmp.dir": "/opt/hadoop/tmp"
      "io.file.buffer.size": "131072"
      "hadoop.security.authentication": "simple"
      "hadoop.security.authorization": "false"
    hdfsSite:
      "dfs.replication": "3"
      "dfs.blocksize": "134217728"
      "dfs.namenode.handler.count": "100"
      "dfs.datanode.handler.count": "10"
      "dfs.datanode.max.transfer.threads": "4096"
      "dfs.permissions.enabled": "true"
      "dfs.webhdfs.enabled": "true"
      "dfs.namenode.acls.enabled": "true"
      "dfs.client.block.write.retries": "3"
      # 注意: HA 相关配置（nameservices, ha.namenodes 等）由 Operator 自动生成
    yarnSite:
      "yarn.resourcemanager.scheduler.class": "org.apache.hadoop.yarn.server.resourcemanager.scheduler.capacity.CapacityScheduler"
      "yarn.scheduler.minimum-allocation-mb": "1024"
      "yarn.scheduler.maximum-allocation-mb": "8192"
      "yarn.scheduler.minimum-allocation-vcores": "1"
      "yarn.scheduler.maximum-allocation-vcores": "4"
      "yarn.nodemanager.resource.memory-mb": "8192"
      "yarn.nodemanager.resource.cpu-vcores": "4"
      "yarn.nodemanager.pmem-check-enabled": "false"
      "yarn.nodemanager.vmem-check-enabled": "false"
      "yarn.nodemanager.aux-services": "mapreduce_shuffle"
      "yarn.nodemanager.aux-services.mapreduce_shuffle.class": "org.apache.hadoop.mapred.ShuffleHandler"
      "yarn.log-aggregation-enable": "true"
      "yarn.log-aggregation.retain-seconds": "604800"
      # 注意: HA 相关配置（rm-ids, hostname.rm* 等）由 Operator 自动生成
    mapredSite:
      "mapreduce.framework.name": "yarn"
      "mapreduce.map.memory.mb": "2048"
      "mapreduce.reduce.memory.mb": "4096"
      "mapreduce.map.java.opts": "-Xmx1638m"
      "mapreduce.reduce.java.opts": "-Xmx3278m"
    capacityScheduler:
      "yarn.scheduler.capacity.maximum-applications": "10000"
      "yarn.scheduler.capacity.maximum-am-resource-percent": "0.1"
      "yarn.scheduler.capacity.root.queues": "default"
      "yarn.scheduler.capacity.root.default.capacity": "100"
      "yarn.scheduler.capacity.root.default.maximum-capacity": "100"
      "yarn.scheduler.capacity.root.default.state": "RUNNING"

  security:
    kerberos:
      enabled: false
    tls:
      enabled: false

  metrics:
    enabled: true
    exporterImage: "prometheus/jmx-exporter:0.20.0"
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
      interval: "30s"
