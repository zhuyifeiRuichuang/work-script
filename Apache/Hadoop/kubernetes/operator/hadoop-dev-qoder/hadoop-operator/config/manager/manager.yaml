apiVersion: apps/v1
kind: Deployment
metadata:
  name: hadoop-operator
  namespace: hadoop
  labels:
    control-plane: hadoop-operator
    app.kubernetes.io/name: hadoop-operator
    app.kubernetes.io/instance: hadoop-operator
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: hadoop-operator
    app.kubernetes.io/part-of: hadoop-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: hadoop-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: hadoop-operator
        app.kubernetes.io/name: hadoop-operator
        app.kubernetes.io/instance: hadoop-operator
        app.kubernetes.io/component: manager
        app.kubernetes.io/created-by: hadoop-operator
        app.kubernetes.io/part-of: hadoop-operator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
                - ppc64le
                - s390x
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - command:
        - /manager
        args:
        - --leader-elect
        image: apache/hadoop-operator:latest
        imagePullPolicy: Always
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OPERATOR_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ENABLE_WEBHOOK
          value: "false"
        - name: LOG_LEVEL
          value: "info"
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
