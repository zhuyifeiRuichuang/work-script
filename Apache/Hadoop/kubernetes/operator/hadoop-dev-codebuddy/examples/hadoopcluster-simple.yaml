# Simple Hadoop Cluster Deployment
# This YAML deploys a basic Hadoop cluster for development/testing
apiVersion: hadoop.kubedoop.dev/v1
kind: HadoopCluster
metadata:
  name: hadoop-simple
  labels:
    app.kubernetes.io/name: hadoopcluster
    app.kubernetes.io/instance: hadoop-simple
    app.kubernetes.io/part-of: hadoop-operator
    app.kubernetes.io/component: hadoop-cluster
spec:
  # Global image configuration
  image: apache/hadoop:3.4.1
  imagePullPolicy: IfNotPresent
  serviceAccountName: hadoop-operator

  # NameNode Configuration (single node mode)
  nameNodeSpec:
    replicas: 1
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 2Gi
    storage:
      useEmptyDir: true

  # DataNode Configuration (3 nodes)
  dataNodeSpec:
    replicas: 3
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 4Gi
    storage:
      useEmptyDir: true

  # ResourceManager Configuration (single node mode)
  resourceManagerSpec:
    replicas: 1
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 2Gi

  # NodeManager Configuration (3 nodes)
  nodeManagerSpec:
    replicas: 3
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 4Gi
