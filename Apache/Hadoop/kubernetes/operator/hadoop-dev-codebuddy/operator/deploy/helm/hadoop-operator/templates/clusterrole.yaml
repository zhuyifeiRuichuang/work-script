{{- if .Values.rbac.create | default true -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hadoop-operator.fullname" . }}-manager
  labels:
    {{- include "hadoop-operator.labels" . | nindent 4 }}
rules:
  # HadoopCluster
  - apiGroups:
      - hadoop.kubedoop.dev
    resources:
      - hadoopclusters
      - hadoopclusters/status
      - hadoopclusters/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # HadoopApplication
  - apiGroups:
      - hadoop.kubedoop.dev
    resources:
      - hadoopapplications
      - hadoopapplications/status
      - hadoopapplications/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Core resources
  - apiGroups:
      - ""
    resources:
      - configmaps
      - configmaps/status
      - secrets
      - secrets/status
      - services
      - services/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - pods
      - pods/status
      - pods/log
      - events
      - events/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Apps resources
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
      - statefulsets
      - statefulsets/status
      - daemonsets
      - daemonsets/status
      - replicasets
      - replicasets/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Policy resources
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
      - poddisruptionbudgets/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Networking resources
  - apiGroups:
      - networking.k8s.io
    resources:
      - services
      - services/status
      - ingresses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # For leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hadoop-operator.fullname" . }}-manager
  labels:
    {{- include "hadoop-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hadoop-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "hadoop-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
