{{- if and .Values.podDisruptionBudget.enabled (gt (.Values.replicaCount | int) 1) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hadoop-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hadoop-operator.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "hadoop-operator.selectorLabels" . | nindent 6 }}
      {{- include "hadoop-operator.operatorLabels" . | nindent 6 }}
{{- end }}
