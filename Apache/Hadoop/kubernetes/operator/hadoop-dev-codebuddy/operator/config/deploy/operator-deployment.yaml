---
# Namespace for the operator
apiVersion: v1
kind: Namespace
metadata:
  name: hadoop-operator-system
  labels:
    app.kubernetes.io/name: hadoop-operator
    app.kubernetes.io/instance: hadoop-operator-system
    app.kubernetes.io/part-of: hadoop-operator

---
# ServiceAccount for the operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hadoop-operator
  namespace: hadoop-operator-system
  labels:
    app.kubernetes.io/name: hadoop-operator
    app.kubernetes.io/instance: hadoop-operator
    app.kubernetes.io/part-of: hadoop-operator

---
# ClusterRole for the operator (cluster-wide permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hadoop-operator
  labels:
    app.kubernetes.io/name: hadoop-operator
    app.kubernetes.io/instance: hadoop-operator
    app.kubernetes.io/part-of: hadoop-operator
rules:
  # Core resources
  - apiGroups:
      - ""
    resources:
      - configmaps
      - events
      - persistentvolumeclaims
      - pods
      - pods/log
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Apps resources
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # RBAC resources
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Hadoop CRD
  - apiGroups:
      - hadoop.kubedoop.dev
    resources:
      - hadoopclusters
      - hadoopclusters/status
      - hadoopclusters/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

---
# RoleBinding for the operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hadoop-operator
  labels:
    app.kubernetes.io/name: hadoop-operator
    app.kubernetes.io/instance: hadoop-operator
    app.kubernetes.io/part-of: hadoop-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hadoop-operator
subjects:
  - kind: ServiceAccount
    name: hadoop-operator
    namespace: hadoop-operator-system

---
# Deployment for the operator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hadoop-operator
  namespace: hadoop-operator-system
  labels:
    app.kubernetes.io/name: hadoop-operator
    app.kubernetes.io/instance: hadoop-operator
    app.kubernetes.io/part-of: hadoop-operator
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hadoop-operator
      app.kubernetes.io/instance: hadoop-operator
      app.kubernetes.io/part-of: hadoop-operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hadoop-operator
        app.kubernetes.io/instance: hadoop-operator
        app.kubernetes.io/part-of: hadoop-operator
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: hadoop-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: manager
          image: hadoop-operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=127.0.0.1:8080
            - --leader-elect-resource-lock=leases
            - --leader-elect-resource-name=hadoop-operator-lock
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 10

---
# RBAC Role for Hadoop cluster components
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hadoop-cluster-role
  namespace: default
  labels:
    app.kubernetes.io/name: hadoop-operator
    app.kubernetes.io/part-of: hadoop-operator
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - events
      - persistentvolumeclaims
      - pods
      - pods/exec
      - pods/log
      - secrets
      - services
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

---
# RoleBinding for Hadoop cluster components
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hadoop-cluster-rolebinding
  namespace: default
  labels:
    app.kubernetes.io/name: hadoop-operator
    app.kubernetes.io/part-of: hadoop-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hadoop-cluster-role
subjects:
  - kind: ServiceAccount
    name: hadoop-operator
    namespace: hadoop-operator-system
