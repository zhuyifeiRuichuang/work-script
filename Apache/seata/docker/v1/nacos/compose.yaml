
services:
  nacos:
    image: nacos/nacos-server:v3.2.2
    container_name: nacos-server
    env_file:
      - ./nacos.env
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    restart: always
    networks:
      - seata-network

networks:
  seata-network:
    name: seata-net
    external: true