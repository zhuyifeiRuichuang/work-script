
---
# Secret - 数据库凭据 (敏感信息)
apiVersion: v1
kind: Secret
metadata:
  name: guacamole-db-secret

type: Opaque
stringData:
  mysql-root-password: "root123456"
  mysql-database: "guacamole_db"
  mysql-user: "guacamole_root"
  mysql-password: "guacamole_dbpass#1A"

---
# ConfigMap - MySQL 配置文件
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config

data:
  my.cnf: |
    [client]
    default-character-set = utf8mb4
    port = 3306
    socket = /var/run/mysqld/mysqld.sock

    [mysql]
    default-character-set = utf8mb4

    [mysqld]
    # --- 基础设置 ---
    user = mysql
    port = 3306
    socket = /var/run/mysqld/mysqld.sock
    pid-file = /var/run/mysqld/mysqld.pid

    # 字符集设置
    character-set-server = utf8mb4
    collation-server = utf8mb4_0900_as_cs
    # 可选，每次会话强制字符集。
    init_connect='SET NAMES utf8mb4 COLLATE utf8mb4_0900_as_cs'

    # 目录设置
    datadir = /var/lib/mysql
    tmpdir = /tmp

    # 时区
    default-time-zone = +08:00

    # --- 连接与安全 ---
    max_connections = 500
    max_allowed_packet = 64M
    skip-name-resolve
    wait_timeout = 28800
    interactive_timeout = 28800

    # --- InnoDB 优化 (适配 MySQL 8.4) ---
    innodb_buffer_pool_size = 1G
    innodb_flush_log_at_trx_commit = 2
    innodb_flush_method = O_DIRECT
    innodb_log_buffer_size = 64M

    # [修正] MySQL 8.4 废弃了 innodb_log_file_size
    # 改用 innodb_redo_log_capacity。计算方式：原 file_size * 2 = 512M
    innodb_redo_log_capacity = 536870912

    # --- 日志配置 (配合 docker 挂载卷) ---
    # 错误日志 (默认输出到 stderr，Docker 建议保留默认，或者指向文件)
    log_error = /var/log/mysql/error.log

    # 慢查询日志
    slow_query_log = 1
    slow_query_log_file = /var/log/mysql/slow.log
    long_query_time = 2
    log_queries_not_using_indexes = 1

    # --- Binlog 配置 ---
    server-id = 1
    binlog_expire_logs_seconds = 604800
    log_bin = /var/log/mysql/mysql-bin
    # 8.0+ 默认开启 binlog，且格式默认为 ROW，通常无需额外配置 format

    # --- 临时表设置 ---
    tmp_table_size = 64M
    max_heap_table_size = 64M

---
# ConfigMap - 数据库初始化 SQL 脚本
# 注意: 此脚本仅在数据目录为空(首次初始化)时执行
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb

data:
  initdb.sql: |
    --
