    -- Create default user "guacadmin" with password "guacadmin"
    INSERT INTO guacamole_entity (name, type) VALUES ('guacadmin', 'USER');
    INSERT INTO guacamole_user (entity_id, password_hash, password_salt, password_date)
    SELECT
        entity_id,
        x'CA458A7D494E3BE824F5E1E175A1556C0F8EEF2C2D7DF3633BEC4A29C4411960',  -- 'guacadmin'
        x'FE24ADC5E11E2B25288D1704ABE67A79E342ECC26064CE69C5B3177795A82264',
        NOW()
    FROM guacamole_entity WHERE name = 'guacadmin';

    -- Grant this user all system permissions
    INSERT INTO guacamole_system_permission (entity_id, permission)
    SELECT entity_id, permission
    FROM (
              SELECT 'guacadmin'  AS username, 'CREATE_CONNECTION'       AS permission
        UNION SELECT 'guacadmin'  AS username, 'CREATE_CONNECTION_GROUP' AS permission
        UNION SELECT 'guacadmin'  AS username, 'CREATE_SHARING_PROFILE'  AS permission
        UNION SELECT 'guacadmin'  AS username, 'CREATE_USER'             AS permission
        UNION SELECT 'guacadmin'  AS username, 'CREATE_USER_GROUP'       AS permission
        UNION SELECT 'guacadmin'  AS username, 'ADMINISTER'              AS permission
    ) permissions
    JOIN guacamole_entity ON permissions.username = guacamole_entity.name AND guacamole_entity.type = 'USER';

    -- Grant admin permission to read/update/administer self
    INSERT INTO guacamole_user_permission (entity_id, affected_user_id, permission)
    SELECT guacamole_entity.entity_id, guacamole_user.user_id, permission
    FROM (
              SELECT 'guacadmin' AS username, 'guacadmin' AS affected_username, 'READ'       AS permission
        UNION SELECT 'guacadmin' AS username, 'guacadmin' AS affected_username, 'UPDATE'     AS permission
        UNION SELECT 'guacadmin' AS username, 'guacadmin' AS affected_username, 'ADMINISTER' AS permission
    ) permissions
    JOIN guacamole_entity          ON permissions.username = guacamole_entity.name AND guacamole_entity.type = 'USER'
    JOIN guacamole_entity affected ON permissions.affected_username = affected.name AND guacamole_entity.type = 'USER'
    JOIN guacamole_user            ON guacamole_user.entity_id = affected.entity_id;



---
# StatefulSet - MySQL 8.4
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql

  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.4.10
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: guacamole-db-secret
              key: mysql-root-password
        - name: MYSQL_ROOT_HOST
          value: "%"
        - name: TZ
          value: Asia/Shanghai
        - name: LANG
          value: C.UTF-8
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: guacamole-db-secret
              key: mysql-database
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: guacamole-db-secret
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: guacamole-db-secret
              key: mysql-password
        volumeMounts:
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-log
          mountPath: /var/log/mysql
        - name: mysql-initdb
          mountPath: /docker-entrypoint-initdb.d/initdb.sql
          subPath: initdb.sql
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - 'mysqladmin ping -h 127.0.0.1 -u root -p"$(MYSQL_ROOT_PASSWORD)"'
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 10
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - 'mysqladmin ping -h 127.0.0.1 -u root -p"$(MYSQL_ROOT_PASSWORD)"'
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
      volumes:
      - name: mysql-config
        configMap:
          name: mysql-config
      - name: mysql-initdb
        configMap:
          name: mysql-initdb
      - name: mysql-log
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      # storageClassName: rook-ceph-block
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi

---
# Service - MySQL (集群内部访问)
apiVersion: v1
kind: Service
metadata:
  name: mysql

spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql

---
# Deployment - Guacd (Guacamole 代理守护进程)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd

  labels:
    app: guacd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacd
  template:
    metadata:
      labels:
        app: guacd
    spec:
      containers:
      - name: guacd
        image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/guacamole/guacd:1.6.0
        ports:
        - containerPort: 4822
          name: guacd
        env:
        - name: TZ
          value: Asia/Shanghai
        readinessProbe:
          tcpSocket:
            port: 4822
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 4822
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi

---
# Service - Guacd (集群内部访问)
apiVersion: v1
kind: Service
metadata:
  name: guacd

spec:
  selector:
    app: guacd
  ports:
  - port: 4822
    targetPort: 4822
    name: guacd

---
# Deployment - Guacamole Web 应用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole

  labels:
    app: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      initContainers:
      - name: wait-for-mysql
        image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox:1.38.0
        command:
        - sh
        - -c
        - 'until nc -z mysql 3306 2>/dev/null; do echo "Waiting for MySQL..."; sleep 5; done;'
      containers:
      - name: guacamole
        image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/guacamole/guacamole:1.6.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: TZ
          value: Asia/Shanghai
        - name: GUACD_HOSTNAME
          value: guacd
        - name: GUACD_PORT
          value: "4822"
        - name: MYSQL_ENABLED
          value: "true"
        - name: MYSQL_HOSTNAME
          value: mysql
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: guacamole-db-secret
              key: mysql-database
        - name: MYSQL_USERNAME
          valueFrom:
            secretKeyRef:
              name: guacamole-db-secret
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: guacamole-db-secret
              key: mysql-password
        - name: WEBAPP_CONTEXT
          value: ROOT
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 8
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 8
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

---
# Service - Guacamole (对外暴露, NodePort)
apiVersion: v1
kind: Service
metadata:
  name: guacamole

spec:
  type: NodePort
  selector:
    app: guacamole
  ports:
  - port: 8080
    targetPort: 8080
    # nodePort: 30080
    name: http
