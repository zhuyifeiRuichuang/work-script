services:
  fe:
    image: apache/doris:fe-4.0.5
    hostname: fe
    container_name: doris-fe
    restart: unless-stopped
    environment:
     - FE_SERVERS=fe1:127.0.0.1:9010
     - FE_ID=1
    network_mode: host
  be:
    image: apache/doris:be-4.0.5
    hostname: be
    container_name: doris-be
    restart: unless-stopped
    environment:
     - FE_SERVERS=fe1:127.0.0.1:9010
     - BE_ADDR=127.0.0.1:9050
    depends_on:
      - fe
    network_mode: host
