apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
data:
  my.cnf: |
    [mysqld]
    max_connections = 2000
    max_allowed_packet = 256M
    innodb_buffer_pool_size = 1G
    innodb_log_file_size = 256M
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci
    
    [client]
    default-character-set = utf8mb4
    
    [mysql]
    default-character-set = utf8mb4
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-hive-db-internal
  labels:
    app: mysql-hive-db
spec:
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP 
  selector:
    app: mysql-hive-db
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-hive-db-external
  labels:
    app: mysql-hive-db
spec:
  type: NodePort 
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql-hive-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-hive-db
spec:
  serviceName: mysql-hive-db-internal 
  replicas: 1
  selector:
    matchLabels:
      app: mysql-hive-db
  template:
    metadata:
      labels:
        app: mysql-hive-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        imagePullPolicy: IfNotPresent
        
        env:
          - name: MYSQL_ROOT_PASSWORD
            value: "root_secure_password"
          - name: MYSQL_DATABASE
            value: "hivedb"
          - name: MYSQL_USER
            value: "hiveuser"
          - name: MYSQL_PASSWORD
            value: "hivepassword"
            
        ports:
        - containerPort: 3306
        
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-config
          mountPath: /etc/mysql/conf.d
          
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
            
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "sleep 30 && mysql -uroot -p$MYSQL_ROOT_PASSWORD -e 'SET GLOBAL max_connections = 2000;'"]
            
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -uroot
            - -p$MYSQL_ROOT_PASSWORD
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -uroot
            - -p$MYSQL_ROOT_PASSWORD
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
      
      volumes:
      - name: mysql-config
        configMap:
          name: mysql-config
          items:
          - key: my.cnf
            path: my.cnf
  
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local"
      resources:
        requests:
          storage: 5Gi
