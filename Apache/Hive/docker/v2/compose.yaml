
services:
  # PostgreSQL 存储 Hive 元数据
  hive-pg:
    image: postgres:18.4
    container_name: hive-pg
    hostname: hive-pg
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-conf/postgresql.conf:/etc/postgresql/postgresql.conf
      - pg-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=hivedb
      - POSTGRES_USER=hiveuser
      - POSTGRES_PASSWORD=hivepassword
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiveuser -d hivedb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hive-network
      - hadoop-net

  # Hive Metastore 服务
  hive-metastore:
    image: ccr.ccs.tencentyun.com/ruichuangdev/hive:dev
    container_name: hive-metastore
    hostname: hive-metastore
    ports:
      - "9083:9083"
    depends_on:
      hive-pg:
        condition: service_healthy
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - ./hive-conf:/opt/hive/conf
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HIVE_CONF_DIR=/opt/hive/conf
    user: "1000"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e 
        echo "Checking and initializing Metastore Schema..."
        hive --service schemaTool -dbType postgres -validate || \
        hive --service schemaTool -dbType postgres -initSchema
        echo "Metastore Schema is ready. Starting Metastore Service..."
        hive --service metastore
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "ps -ef | grep HiveMetaStore | grep -v grep"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - hive-network
      - hadoop-net

  # HiveServer2 服务
  hive-server2:
    image: ccr.ccs.tencentyun.com/ruichuangdev/hive:dev
    container_name: hive-server2
    hostname: hive-server2
    ports:
      - "10000:10000"   # JDBC 连接端口
      - "10002:10002"   # HiveServer2 Web UI 端口
    depends_on:
      hive-metastore:
        condition: service_started
    volumes:
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - ./hive-conf:/opt/hive/conf
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HIVE_CONF_DIR=/opt/hive/conf
    user: "1000"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        hive --service hiveserver2
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "ps -ef | grep HiveServer2 | grep -v grep"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 80s
    networks:
      - hive-network
      - hadoop-net

# 数据卷
volumes:
  pg-data:

networks:
  hive-network:
    driver: bridge
  hadoop-net:
    external: true
    name: hadoop-net
