# 命名卷（持久化数据，与服务内挂载一一对应）
volumes:
  metastore-data:
    name: metastore-data
  mysql-hive-data:
    name: mysql-hive-data
  mysql-hive-logs:
    name: mysql-hive-logs

networks:
  hive:
    name: hive-net
    driver: bridge

services:
  # Hive 元数据存储 MySQL 服务
  mysql-hive:
    image: mysql:9.6.0
    container_name: mysql-hive
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: hive
      MYSQL_PASSWORD: hive
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
      - mysql-hive-data:/var/lib/mysql
      - mysql-hive-logs:/var/log/mysql
    networks:
      - hive

  # Hive Metastore 服务
  metastore:
    image: zhuyifeiruichuang/hive:3.1.2-mysql9
    container_name: metastore
    restart: always
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "ps -ef | grep HiveMetaStore | grep -v grep"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      SERVICE_OPTS: >
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql-hive:3306/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - metastore-data:/opt/hive/data/warehouse
    depends_on:
      mysql-hive:
        condition: service_healthy
    networks:
      - hive

  # Hive Server2 服务
  hiveserver2:
    image: zhuyifeiruichuang/hive:3.1.2-mysql9
    container_name: hiveserver2
    restart: always
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "ps -ef | grep HiveServer2 | grep -v grep"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 80s
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: "-Dhive.metastore.uris=thrift://metastore:9083"
      IS_RESUME: "true"
    volumes:
      - metastore-data:/opt/hive/data/warehouse
    depends_on:
      metastore:
        condition: service_healthy
    networks:
      - hive