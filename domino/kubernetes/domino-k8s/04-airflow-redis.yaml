# ============================================================
# Redis - Message broker for Airflow CeleryExecutor
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-redis
  namespace: domino
  labels:
    app: airflow-redis
    app.kubernetes.io/part-of: domino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-redis
  template:
    metadata:
      labels:
        app: airflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: airflow-redis
  namespace: domino
  labels:
    app: airflow-redis
    app.kubernetes.io/part-of: domino
spec:
  type: ClusterIP
  selector:
    app: airflow-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
