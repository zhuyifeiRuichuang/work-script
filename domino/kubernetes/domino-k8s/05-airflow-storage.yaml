# ============================================================
# Airflow Shared Storage - PVCs for DAGs, logs, plugins
# ============================================================
# These PVCs are shared between Airflow components and the
# Domino REST API to enable DAG synchronization.
#
# FIX: Changed ReadWriteMany → ReadWriteOnce because
# StorageClass "local" (OpenEBS Local PV) only supports RWO.
# All pods must be scheduled on the same node for volume sharing.
# ============================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-dags-pvc
  namespace: domino
  labels:
    app.kubernetes.io/part-of: domino
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs-pvc
  namespace: domino
  labels:
    app.kubernetes.io/part-of: domino
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local
  resources:
    requests:
      storage: 5Gi

---
# Shared storage for workflow data between tasks
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: domino-workflow-shared-storage-volume-claim
  namespace: domino
  labels:
    app.kubernetes.io/part-of: domino
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local
  resources:
    requests:
      storage: 10Gi
