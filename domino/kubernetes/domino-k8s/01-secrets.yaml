# ============================================================
# Domino K8s Secrets
# ============================================================
# IMPORTANT: Replace all placeholder values before deploying!
#   - Change DB passwords
#   - Set your GitHub tokens
#   - Change Airflow admin password
#   - Generate a proper Fernet key for Airflow
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: domino-secrets
  namespace: domino
  labels:
    app.kubernetes.io/part-of: domino
type: Opaque
stringData:
  # -- Domino Database --
  DOMINO_DB_USER: "postgres"
  DOMINO_DB_PASSWORD: "CHANGE_ME_domino_db_password"    # ← CHANGE THIS
  DOMINO_DB_NAME: "domino"
  DOMINO_DB_HOST: "domino-postgres"
  DOMINO_DB_PORT: "5432"

  # -- Airflow Database --
  AIRFLOW_DB_USER: "airflow"
  AIRFLOW_DB_PASSWORD: "CHANGE_ME_airflow_db_password"  # ← CHANGE THIS
  AIRFLOW_DB_NAME: "airflow"

  # -- Airflow Admin --
  AIRFLOW_ADMIN_USERNAME: "admin"
  AIRFLOW_ADMIN_PASSWORD: "CHANGE_ME_airflow_admin"     # ← CHANGE THIS

  # -- GitHub Tokens --
  # Token with write access (REST API pushes DAGs here)
  DOMINO_GITHUB_ACCESS_TOKEN_WORKFLOWS: "ghp_CHANGE_ME"  # ← CHANGE THIS
  # Token with read access (for piece repositories)
  DOMINO_DEFAULT_PIECES_REPOSITORY_TOKEN: "ghp_CHANGE_ME" # ← CHANGE THIS

  # -- Airflow Fernet Key (generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())") --
  AIRFLOW_FERNET_KEY: "CHANGE_ME_generate_with_fernet"  # ← CHANGE THIS

  # -- Airflow Secret Key (generate with: python -c "import secrets; print(secrets.token_hex(32))") --
  AIRFLOW_SECRET_KEY: "CHANGE_ME_generate_random_32hex"  # ← CHANGE THIS

  # -- Auth --
  AUTH_SECRET_KEY: "CHANGE_ME_domino_auth_secret"        # ← CHANGE THIS
