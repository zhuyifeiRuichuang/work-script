# ============================================================
# Airflow RBAC - ServiceAccount, ClusterRole, Binding
# ============================================================
# Required because Domino's k8s_operator (KubernetesPodOperator)
# creates pods in the cluster to execute workflow tasks.
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-worker
  namespace: domino
  labels:
    app.kubernetes.io/part-of: domino

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-worker-role
  namespace: domino
  labels:
    app.kubernetes.io/part-of: domino
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "secrets", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-worker-rolebinding
  namespace: domino
  labels:
    app.kubernetes.io/part-of: domino
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-worker-role
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: domino
