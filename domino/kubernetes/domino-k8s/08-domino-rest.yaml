# ============================================================
# Domino REST API Deployment
# ============================================================
# Runs Alembic migrations on startup, then serves the API.
# Connects to Domino PostgreSQL and communicates with Airflow.
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: domino-rest
  namespace: domino
  labels:
    app: domino-rest
    app.kubernetes.io/part-of: domino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: domino-rest
  template:
    metadata:
      labels:
        app: domino-rest
    spec:
      initContainers:
        # Wait for Domino PostgreSQL
        - name: wait-for-domino-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Domino PostgreSQL..."
              until nc -z domino-postgres 5432; do
                echo "  ...not ready yet"
                sleep 2
              done
              echo "Domino PostgreSQL is ready!"
        # Wait for Airflow to be ready
        - name: wait-for-airflow-webserver
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Airflow webserver..."
              until nc -z airflow-webserver 8080; do
                echo "  ...not ready yet"
                sleep 5
              done
              echo "Airflow webserver is ready!"
      containers:
        - name: domino-rest
          image: ghcr.io/tauffer-consulting/domino-rest:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              # Run database migrations
              echo "=== Running Alembic migrations ==="
              alembic upgrade heads

              # Start the API server
              echo "=== Starting Domino REST API ==="
              uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DOMINO_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: DOMINO_DB_HOST
            - name: DOMINO_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: DOMINO_DB_PORT
            - name: DOMINO_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: DOMINO_DB_NAME
            - name: DOMINO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: DOMINO_DB_USER
            - name: DOMINO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: DOMINO_DB_PASSWORD
            - name: DOMINO_DEPLOY_MODE
              value: "local-k8s"
            - name: CREATE_DEFAULT_USER
              value: "true"
            - name: DOMINO_DEFAULT_PIECES_REPOSITORY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: DOMINO_DEFAULT_PIECES_REPOSITORY_TOKEN
            - name: DOMINO_GITHUB_ACCESS_TOKEN_WORKFLOWS
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: DOMINO_GITHUB_ACCESS_TOKEN_WORKFLOWS
            - name: DOMINO_GITHUB_WORKFLOWS_REPOSITORY
              value: "Tauffer-Consulting/domino_workflows_dev"    # ← CHANGE to your repo
            - name: AIRFLOW_WEBSERVER_HOST
              value: "http://airflow-webserver:8080"
            - name: AIRFLOW_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: AIRFLOW_ADMIN_USERNAME
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: AIRFLOW_ADMIN_PASSWORD
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: domino-secrets
                  key: AUTH_SECRET_KEY
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: airflow-dags
          persistentVolumeClaim:
            claimName: airflow-dags-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: domino-rest
  namespace: domino
  labels:
    app: domino-rest
    app.kubernetes.io/part-of: domino
spec:
  type: ClusterIP
  selector:
    app: domino-rest
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
