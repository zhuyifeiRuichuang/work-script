server {
    listen       80;
    listen  [::]:80;
    server_name  _; # 生产环境请修改为实际域名，如 www.example.com

    # 设置字符集编码，避免中文乱码
    charset utf-8;

    # 显式使用 nginx.conf 中定义的 main 格式日志
    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log warn;

    # ================= 基础安全 Headers =================
    add_header X-Frame-Options "SAMEORIGIN" always;         # 防御点击劫持
    add_header X-XSS-Protection "1; mode=block" always;     # 启用跨站脚本过滤器
    add_header X-Content-Type-Options "nosniff" always;     # 禁止浏览器猜测 MIME-Type
    add_header Referrer-Policy "no-referrer-when-downgrade" always; 

    # ================= 1. 前端静态资源/SPA 路由 =================
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 支持 React/Vue 等单页应用 (SPA) 的前端路由
        try_files $uri $uri/ /index.html; 
    }

    # ================= 2. 后端接口反向代理 (示例) =================
    # location /api/ {
    #     # 开启限流保护 (允许瞬间 20 个突发请求，超过的直接排队或拒绝)
    #     limit_req zone=mylimit burst=20 nodelay;
    #     limit_conn addr 50;
    #
    #     # 强烈建议：使用 Docker 内部的服务名进行代理，而非硬编码 IP
    #     proxy_pass http://backend-prod:8080/; 
    #
    #     # 传递客户端真实信息给后端应用
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     # 后端超时设置
    #     proxy_connect_timeout 60s;
    #     proxy_read_timeout 60s;
    #     proxy_send_timeout 60s;
    # }

    # ================= 3. 静态资源深度缓存优化 =================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        root /usr/share/nginx/html;
        expires 30d; # 浏览器缓存 30 天
        access_log off; # 静态文件不记录访问日志，降低磁盘 IO
        add_header Cache-Control "public, no-transform";
    }

    # ================= 4. 错误页面统一接管 =================
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # ================= 5. 敏感文件防御 =================
    # 拒绝访问如 .git, .env, .htaccess 等隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}