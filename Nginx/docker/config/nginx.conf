# 运行用户，Alpine 镜像默认使用 nginx 用户
user  nginx;
# 生产环境建议设置为 auto，Nginx 会自动根据 CPU 核心数启动 worker 进程
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    # 每个 worker 进程允许的最大连接数（需配合 Docker 的 ulimits nofile 使用）
    worker_connections  10240;
    # 允许一个 worker 进程同时接受多个新连接
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 定义主日志格式，包含真实 IP、请求时间等关键信息
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '$request_time $upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # 核心性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    
    # 保持连接的超时时间
    keepalive_timeout  65;

    # 安全配置：隐藏 Nginx 版本号
    server_tokens off;

    # ================= 限流/防 CC 攻击配置区 =================
    # 定义一个名为 "mylimit" 的内存区，限制同一个 IP 每秒最多 10 个请求
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
    # 限制单个 IP 同时保持的连接数不超过 50 个
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ================= Gzip 压缩优化区 =================
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024; # 小于 1KB 的文件不压缩
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 引入具体的站点配置
    include /etc/nginx/conf.d/*.conf;
}