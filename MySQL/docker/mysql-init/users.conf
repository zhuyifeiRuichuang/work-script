# 用户定义：username:password:host
[users]
app_user:App@123456:%
xxljob_user:XxlJob@123456:%
flow_user:Flow@123456:%
sso_user:Sso@123456:%
tenant_user:Tenant@123456:%
column_user:Column@123456:%
readonly_user:Readonly@123456:%

# 数据库权限定义：database_grants:database_name
# 格式：username:permissions
[database_grants:jnpf_init]
app_user:ALL PRIVILEGES
readonly_user:SELECT

[database_grants:xxl_job]
xxljob_user:ALL PRIVILEGES
readonly_user:SELECT

[database_grants:jnpf_flow]
flow_user:SELECT,INSERT,UPDATE,DELETE
readonly_user:SELECT

[database_grants:jnpf_sso]
sso_user:ALL PRIVILEGES
readonly_user:SELECT

[database_grants:jnpf_tenant]
tenant_user:SELECT,INSERT,UPDATE,DELETE
readonly_user:SELECT

[database_grants:jnpf_init_column]
column_user:SELECT,INSERT
readonly_user:SELECT